<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>تحلیل روند ارز دیجیتال</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--up:#16a34a;--dn:#dc2626;--ne:#d97706;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e5e9f0;--mu:#94a3b8;--bd:#25314a;--up:#4ade80;--dn:#f87171;--ne:#fbbf24;--ac:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));max-width:560px;margin-inline:auto}
h1{font-size:18px;margin:6px 0 12px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);direction:ltr;text-transform:uppercase}
button{padding:12px 18px;font-size:15px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.tf{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.tf:last-child{border:0}
.mu{color:var(--mu);font-size:12px}
.up{color:var(--up)}.dn{color:var(--dn)}.ne{color:var(--ne)}
.sig{font-size:17px;font-weight:bold;margin-bottom:6px}
.lv{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.lv b{direction:ltr}
ul{margin:6px 0 0;padding-inline-start:18px;font-size:13px;line-height:1.9}
</style>
</head>
<body>
<h1>تحلیل روند چند تایم فریم</h1>
<div class="row">
<input id="sym" placeholder="BTC" autocomplete="off" autocapitalize="characters">
<button id="go">تحلیل</button>
</div>
<div id="out"></div>
<script>
const TFS=["15m","1h","4h","1d"],W={"15m":1,"1h":2,"4h":3,"1d":4},LIM=300;
const BH=["https://api.binance.com","https://api1.binance.com","https://data-api.binance.vision"];
const KU={"15m":"15min","1h":"1hour","4h":"4hour","1d":"1day"},BY={"15m":"15","1h":"60","4h":"240","1d":"D"};
const jget=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
const N=Number;
async function binance(s,tf){let e;for(const h of BH){try{const d=await jget(`${h}/api/v3/klines?symbol=${s}&interval=${tf}&limit=${LIM}`);return d.map(x=>({o:N(x[1]),h:N(x[2]),l:N(x[3]),c:N(x[4]),v:N(x[5])}))}catch(x){e=x}}throw e}
async function kucoin(s,tf){const d=(await jget(`https://api.kucoin.com/api/v1/market/candles?type=${KU[tf]}&symbol=${s.slice(0,-4)}-${s.slice(-4)}`)).data;return d.slice(0,LIM).reverse().map(x=>({o:N(x[1]),c:N(x[2]),h:N(x[3]),l:N(x[4]),v:N(x[5])}))}
async function bybit(s,tf){const d=(await jget(`https://api.bybit.com/v5/market/kline?category=spot&symbol=${s}&interval=${BY[tf]}&limit=${LIM}`)).result.list;return d.reverse().map(x=>({o:N(x[1]),h:N(x[2]),l:N(x[3]),c:N(x[4]),v:N(x[5])}))}
async function candles(s,tf){for(const f of [binance,kucoin,bybit]){try{const c=await f(s,tf);if(c.length>60)return c}catch(e){}}throw new Error("دریافت داده ممکن نشد. VPN را بررسی کنید یا نماد را عوض کنید.")}

const ema=(v,n)=>{const k=2/(n+1),o=[v[0]];for(let i=1;i<v.length;i++)o.push(v[i]*k+o[i-1]*(1-k));return o};
function rsi(c,n=14){let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=n;l/=n;for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l===0?100:100-100/(1+g/l)}
function macd(c){const a=ema(c,12),b=ema(c,26),ln=a.map((x,i)=>x-b[i]),sg=ema(ln,9),i=ln.length-1;return[ln[i],sg[i],ln[i]-sg[i]]}
function boll(c,n=20){const s=c.slice(-n),m=s.reduce((a,b)=>a+b)/n;return m}
function atrAdx(cs,n=14){const tr=[],pd=[],md=[];for(let i=1;i<cs.length;i++){const h=cs[i].h,l=cs[i].l,pc=cs[i-1].c,up=h-cs[i-1].h,dn=cs[i-1].l-l;tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));pd.push(up>dn&&up>0?up:0);md.push(dn>up&&dn>0?dn:0)}
const sm=a=>a.slice(0,n).reduce((x,y)=>x+y);let a=sm(tr),p=sm(pd),m=sm(md),dx=[],pdi=0,mdi=0;
for(let i=n;i<tr.length;i++){a=a-a/n+tr[i];p=p-p/n+pd[i];m=m-m/n+md[i];pdi=100*p/a;mdi=100*m/a;dx.push(pdi+mdi?100*Math.abs(pdi-mdi)/(pdi+mdi):0)}
let adx=dx.slice(0,n).reduce((x,y)=>x+y)/n;for(let i=n;i<dx.length;i++)adx=(adx*(n-1)+dx[i])/n;return[a/n,adx,pdi,mdi]}
function stoch(cs,n=14){const ks=[];for(let i=n-1;i<cs.length;i++){const s=cs.slice(i-n+1,i+1),hh=Math.max(...s.map(x=>x.h)),ll=Math.min(...s.map(x=>x.l));ks.push(hh!==ll?100*(cs[i].c-ll)/(hh-ll):50)}return[ks[ks.length-1],ks.slice(-3).reduce((a,b)=>a+b)/3]}
function obvUp(cs){let o=0;const s=[0];for(let i=1;i<cs.length;i++){if(cs[i].c>cs[i-1].c)o+=cs[i].v;else if(cs[i].c<cs[i-1].c)o-=cs[i].v;s.push(o)}return s[s.length-1]>ema(s,20).pop()}

function analyze(cs){
const c=cs.map(x=>x.c),price=c[c.length-1],e20=ema(c,20).pop(),e50=ema(c,50).pop(),e200=c.length>=200?ema(c,200).pop():null;
const r=rsi(c),[ml,ms,mh]=macd(c),bm=boll(c),[atr,adx,pdi,mdi]=atrAdx(cs),[k,d]=stoch(cs),ou=obvUp(cs);
const pts=[],notes=[];
const add=(u,dn,nu,nd)=>{if(u){pts.push(1);notes.push(["up",nu])}else if(dn){pts.push(-1);notes.push(["dn",nd])}else pts.push(0)};
add(price>e50,price<=e50,"قیمت بالای EMA50","قیمت زیر EMA50");
add(e20>e50,e20<=e50,"EMA20 بالای EMA50","EMA20 زیر EMA50");
if(e200)add(e50>e200,e50<=e200,"EMA50 بالای EMA200","EMA50 زیر EMA200");
add(ml>ms,ml<=ms,"MACD بالای سیگنال","MACD زیر سیگنال");
add(mh>0,mh<=0,"هیستوگرام MACD مثبت","هیستوگرام MACD منفی");
if(r<30){pts.push(1);notes.push(["up","RSI اشباع فروش ("+r.toFixed(0)+")"])}
else if(r>70){pts.push(-1);notes.push(["dn","RSI اشباع خرید ("+r.toFixed(0)+")"])}
else if(r>=52){pts.push(1);notes.push(["up","RSI قوی ("+r.toFixed(0)+")"])}
else if(r<=48){pts.push(-1);notes.push(["dn","RSI ضعیف ("+r.toFixed(0)+")"])}
else pts.push(0);
add(k>d&&k<85,k<d&&k>15,"استوکاستیک صعودی","استوکاستیک نزولی");
add(price>bm,price<=bm,"قیمت بالای میانگین بولینگر","قیمت زیر میانگین بولینگر");
add(pdi>mdi,pdi<=mdi,"DI+ بالای DI-","DI- بالای DI+");
add(ou,!ou,"حجم (OBV) صعودی","حجم (OBV) نزولی");
const seg=cs.slice(-50);
return{price,score:100*pts.reduce((a,b)=>a+b)/pts.length,rsi:r,adx,atr,notes,sup:Math.min(...seg.map(x=>x.l)),res:Math.max(...seg.map(x=>x.h))}}

const label=s=>s>=45?["صعودی قوی ▲▲","up"]:s>=15?["صعودی ▲","up"]:s>-15?["خنثی ◆","ne"]:s>-45?["نزولی ▼","dn"]:["نزولی قوی ▼▼","dn"];
const fmt=x=>x<1?x.toFixed(6):x<100?x.toFixed(4):x.toFixed(2);

function render(sym,res){
const tot=TFS.reduce((a,t)=>a+res[t].score*W[t],0)/Object.values(W).reduce((a,b)=>a+b);
const h1=res["1h"],h4=res["4h"],d1=res["1d"],p=h1.price,risk=1.5*h1.atr;
const buy=tot>=30&&h4.score>0&&d1.score>-15&&h1.score>0,sell=tot<=-30&&h4.score<0&&d1.score<15&&h1.score<0;
const [tl,tc]=label(tot);let h=`<div class="card"><div class="mu">${sym}</div><div style="font-size:22px;direction:ltr;text-align:right">${fmt(p)}</div></div><div class="card">`;
for(const t of TFS){const a=res[t],[l,c]=label(a.score);h+=`<div class="tf"><span><b>${t}</b> <span class="${c}">${l}</span><br><span class="mu">RSI ${a.rsi.toFixed(0)} | قدرت روند: ${a.adx>=25?"قوی":"ضعیف"} (ADX ${a.adx.toFixed(0)})</span></span><b class="${c}" style="direction:ltr">${a.score>0?"+":""}${a.score.toFixed(0)}</b></div>`}
h+=`</div><div class="card"><div class="mu">امتیاز کل (وزن بیشتر برای تایم بالاتر)</div><div class="sig ${tc}">${tl} (${tot>0?"+":""}${tot.toFixed(0)})</div>`;
if(buy||sell){const g=buy?1:-1;h+=`<div class="sig ${buy?"up":"dn"}">✅ سیگنال ${buy?"خرید (Long)":"فروش (Short)"}</div>
<div class="lv"><span>ورود</span><b>${fmt(p)}</b></div><div class="lv"><span>حد ضرر</span><b>${fmt(p-g*risk)}</b></div>
<div class="lv"><span>هدف ۱ (1.5R)</span><b>${fmt(p+g*1.5*risk)}</b></div><div class="lv"><span>هدف ۲ (3R)</span><b>${fmt(p+g*3*risk)}</b></div>`;
if(buy&&h1.rsi>70||sell&&h1.rsi<30)h+=`<div class="mu">⚠ RSI ساعتی در اشباع است؛ بهتر است منتظر پولبک بمانید.</div>`}
else h+=`<div class="ne">⏳ فعلا موقعیت مناسبی نیست (تایم فریم ها هم جهت نیستند).</div>`;
h+=`<div class="lv" style="margin-top:8px"><span class="mu">حمایت / مقاومت ۴ ساعته</span><b>${fmt(h4.sup)} / ${fmt(h4.res)}</b></div></div>
<div class="card"><b>دلایل تایم ۴ ساعته</b><ul>${h4.notes.map(n=>`<li class="${n[0]}">${n[1]}</li>`).join("")}</ul></div>
<p class="mu">این ابزار فقط کمک تحلیلی است، نه توصیه مالی. حد ضرر را رعایت کنید.</p>`;
document.getElementById("out").innerHTML=h}

async function run(){
const out=document.getElementById("out"),btn=document.getElementById("go");
let s=document.getElementById("sym").value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(!s)return;
if(s==="BTC"||!/(USDT|USDC|BTC)$/.test(s))s+="USDT";
btn.disabled=true;out.innerHTML='<div class="card mu">در حال دریافت داده...</div>';
try{const all=await Promise.all(TFS.map(t=>candles(s,t)));const res={};TFS.forEach((t,i)=>res[t]=analyze(all[i]));render(s,res)}
catch(e){out.innerHTML=`<div class="card dn">${e.message}</div>`}
btn.disabled=false}
document.getElementById("go").onclick=run;
document.getElementById("sym").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
</script>
</body>
</html>
